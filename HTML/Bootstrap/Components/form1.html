<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>
<style>
    body{
        width: 100%;
        height: 100vh;
        background-color: blue;
        background-image: url("https://t3.ftcdn.net/jpg/15/42/32/32/360_F_1542323292_vpxI2BypeFHgSZUvuSRlJLACFn0yzp6d.jpg");
        background-repeat: no-repeat;
        background-size: cover;
    }
</style>
<body>
    <div class="container d-flex justify-content-center mt-5">
        <form action="" class="shadow-lg w-75 p-5 rounded-2 bg-light">
            <p class="text-center fs-3">Powering world-class companies</p>
            <div class="row mt-lg-4">
                <div class="col-lg-6">
                    <div>
                        <label for="" class="form-label fs-5">First Name</label>
                        <input type="text" class="form-control" placeholder="Enter your first name">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label for="" class="form-label fs-5">Last Name</label>
                        <input type="text" class="form-control" placeholder="Enter your last name">
                    </div>
                </div>
            </div>
            <div class="row mt-lg-4">
                <div class="col-lg-6">
                    <div>
                        <label for="" class="form-label fs-5">Busines Email</label>
                        <input type="email" class="form-control">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div>
                        <label for="" class="form-label fs-5">Phone number</label>
                        <input type="number" class="form-control" >
                    </div>
                </div>
            </div>
            <div class="row mt-lg-4">
                <div class="col-lg-6">
                    <div>
                        <label for="" class="form-label fs-5">Jop title</label>
                        <input type="number" class="form-control" >
                    </div>
                </div>
            </div>
            <div class="row mt-lg-4">
                <div class="col-lg-12">
                    <div>
                        <label for="" class="form-label fs-5">What would you be using flink?</label>
                        <input type="text " class="form-control" >
                    </div>
                </div>
            </div>
            <div class="mt-lg-4">
                <button class="w-50 btn btn-primary float-end ">REQUEST A DEMO</button>
            </div>
        </form>
    </div>
</body>
</html>
