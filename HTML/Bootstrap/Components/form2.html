<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #6a80b4;
    }

    /* Styled Header Bar */
    .custom-navbar {
        height: 80px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
    }

    /* Navigation Links Styling */
    .nav-custom-link {
        color: #94a3b8 !important;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s ease;
        padding: 8px 12px;
        border-radius: 6px;
    }

    .nav-custom-link:hover {
        color: #ffffff !important;
        background-color: rgba(255, 255, 255, 0.05);
    }

    /* Icon Buttons Styling */
    .icon-btn {
        color: #94a3b8;
        cursor: pointer;
        transition: color 0.3s ease, transform 0.2s ease;
    }

    .icon-btn:hover {
        color: #38bdf8;
        transform: translateY(-2px);
    }

    /* Primary CTA Button Glow */
    .btn-glow {
        background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        box-shadow: 0 4px 14px 0 rgba(2, 132, 199, 0.39);
        transition: all 0.3s ease;
    }

    .btn-glow:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px 0 rgba(2, 132, 199, 0.55);
    }
</style>
<body>
    <div class="container-fluid shadow-lg custom-navbar w-100">
        <div class="row h-100 align-items-center">
            <!-- Logo Section -->
            <div class="col-lg-2 d-flex justify-content-center align-items-center h-100">
                <div class="w-50 d-flex align-items-center justify-content-center">
                    <img class="img-fluid" src="https://cdn.prod.website-files.com/64ea57571d50b02423c4505d/64fa5d6a3dc59b592a02e056_bmw%20m%20logo.png" alt="Logo">
                </div>
            </div>

            <!-- Nav Links Section -->
            <div class="col-lg-5">
                <div class="h-100 d-flex justify-content-center align-items-center">
                    <ul class="d-flex gap-4 list-unstyled m-0">
                        <li><a class="nav-custom-link" href="#">Products <i class="fa-solid fa-angle-down ms-1 fs-6"></i></a></li>
                        <li><a class="nav-custom-link" href="#">Solution <i class="fa-solid fa-angle-down ms-1 fs-6"></i></a></li>
                        <li><a class="nav-custom-link" href="#">Pricing</a></li>
                        <li><a class="nav-custom-link" href="#">About Us</a></li>
                        <li><a class="nav-custom-link" href="#">Contact</a></li>
                    </ul>
                </div>
            </div>

            <!-- Action & Profile Section -->
            <div class="col-lg-5">
                <div class="d-flex h-100 justify-content-center align-items-center gap-4">
                    <i class="fa-solid fa-magnifying-glass fs-5 icon-btn"></i>
                    <i class="fa-regular fa-bell fs-5 icon-btn"></i>
                    <i class="fa-regular fa-user fs-5 icon-btn"></i>
                    <div class="d-flex gap-2">
                        <button class="btn text-light fw-medium px-3">Sign In</button>
                        <button class="btn btn-glow px-4 text-light fw-semibold rounded-pill">Get Started</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
