<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f7;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .product-card {
            border-radius: 18px;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            background: #fff;
        }

        .product-img-wrap {
            position: relative;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .product-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .badge-corner {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #e0455f;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .product-title {
            font-weight: 700;
            font-size: 1.5rem;
            color: #212529;
        }

        .product-sub {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .stars i {
            color: #f0b429;
            font-size: 0.9rem;
        }

        .price-current {
            font-weight: 700;
            font-size: 1.3rem;
            color: #212529;
        }

        .price-old {
            color: #adb5bd;
            text-decoration: line-through;
            font-size: 1.1rem;
        }

        .cart-icon {
            color: #212529;
            font-size: 1.1rem;
        }

        .btn-order {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px 26px;
            border: none;
        }

        .btn-order:hover {
            background: #1d4ed8;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row g-4">

            <!-- Card 1 -->
            <div class="col-md-6 col-lg-4">
                <div class="product-card h-100 d-flex flex-column">
                    <div class="product-img-wrap">
                        <span class="badge-corner">10% OFF</span>
                        <img class="w-100 h-100 object-fit-cover" src="https://www.hollywoodreporter.com/wp-content/uploads/2025/09/Still-5-Copyright_-Koyoharu-Gotoge-_-SHUEISHA-Aniplex-ufotable-H-2025.jpg?w=1296&h=730&crop=1" alt="Demonslayer">
                    </div>
                    <div class="p-4 pt-2">
                        <h3 class="product-title mb-2">Demonslayer</h3>
                        <p class="product-sub mb-3">Best Anime</p>
                        <div class="stars mb-2">
                            <i class="fa-regular fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="price-current">$65.00</span>
                            <i class="fa-solid fa-cart-shopping cart-icon ms-1"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-6 col-lg-4">
                <div class="product-card h-100 d-flex flex-column">
                    <div class="product-img-wrap">
                        <span class="badge-corner">NEW</span>
                        <img class="w-100 h-100 object-fit-cover" src="https://images.imagerenderer.com/images/artworkimages/mediumlarge/2/zoro-one-piece-anime-ihab-design.jpg"
                            alt="ZORO">
                    </div>
                    <div class="p-4 pt-2">
                        <h3 class="product-title mb-1">ZORO</h3>
                        <p class="product-sub mb-3">Best Anime</p>
                        <div class="d-flex align-items-center flex-wrap gap-3">
                            <span class="price-current">$65.00</span>
                            <i class="fa-solid fa-cart-shopping cart-icon"></i>
                            <span class="price-old">$95.00</span>
                            <button class="btn btn-order ms-auto">ORDER</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
