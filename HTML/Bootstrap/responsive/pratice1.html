<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Footer — Bootstrap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
        <style>
  :root{
    --footer-bg:#1e2430;
    --footer-text:#e9ebef;
    --footer-muted:#a7adbb;
    --footer-border:rgba(255,255,255,.08);
  }
  body{ margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }

  footer.site-footer{
    background:var(--footer-bg);
    color:var(--footer-text);
    padding:3rem 0 1.5rem;
  }
  footer.site-footer h5{
    font-weight:600;
    font-size:1.05rem;
    margin-bottom:.9rem;
    color:#fff;
  }
  footer.site-footer p,
  footer.site-footer li,
  footer.site-footer a{
    color:var(--footer-muted);
    font-size:.92rem;
    line-height:1.7;
  }
  footer.site-footer a{
    text-decoration:none;
    transition:color .15s ease;
  }
  footer.site-footer a:hover{
    color:#fff;
  }
  footer.site-footer ul{
    list-style:none;
    padding-left:0;
    margin-bottom:0;
  }
  footer.site-footer .footer-col{
    margin-bottom:2rem;
  }
  .footer-bottom{
    border-top:1px solid var(--footer-border);
    margin-top:1rem;
    padding-top:1.25rem;
    text-align:center;
    font-size:.8rem;
    color:var(--footer-muted);
  }

  /* Center columns on small/medium screens, left-align from lg up */
  @media (max-width: 991.98px){
    footer.site-footer .footer-col{ text-align:center; }
  }
</style>
</head>
<body>
  
<footer class="site-footer">
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-4 footer-col">
        <h5>Wedding</h5>
        <p class="mb-0">Thank you for celebrating our special day.</p>
      </div>

      <div class="col-12 col-md-4 footer-col">
        <h5>Quick Links</h5>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">RSVP</a></li>
          <li><a href="#">Gallery</a></li>
        </ul>
      </div>

      <div class="col-12 col-md-4 footer-col">
        <h5>Contact</h5>
        <p class="mb-1">Email: wedding@email.com</p>
        <p class="mb-0">Phone: +855 12 345 678</p>
      </div>
    </div>

    <div class="footer-bottom">
      &copy; 2026 All Rights Reserved
    </div>
  </div>
</footer>

</body>
</html>
