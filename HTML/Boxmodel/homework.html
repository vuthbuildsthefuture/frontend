<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .product_card{
        width: 250px;
        height: 300px;
        border: 1px solid purple;
        padding: 15px;
        margin: 20px;
        border-radius: 10px;
        background-color: aqua;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
    }

    .product_card img{
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 5px;
        margin-bottom: 10px;
    }

    .product_card h3{
        margin: 0 0 10px;
        font-size: 20px;
    }

    .product_card p{
        margin: 0 0 15px;
        font-size: 14px;
    }

    .product_card button{
        padding: 10px 10px;
        background-color: rgb(58, 116, 179);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .product_card button:hover{
        background-color: brown;
    }
</style>
<body>
    <div class="product_card">
        <img src="https://dlcdnwebimgs.asus.com/gain/FBAAC5C2-2ED4-406C-AA47-5A105797004A/w750/h470/fwebp" alt="ROG Headphone">
        <h3>Wireless Headphone</h3>
        <p>$59.99</p>
        <button>Add to Card</button>
    </div>
</body>
</html>
