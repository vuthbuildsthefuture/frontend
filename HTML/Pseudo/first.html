<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .hover button{
        width: 130px;
        height: 50px;
        border-radius: 10px;
        transition: all 0.4s ease-in-out;
    }
    .hover button:hover{
        background-color: blue;
        color: white;
    }
    .active button{
        width: 130px;
        height: 50px;
        border-radius: 10px;
        transition: all 0.4s ease-in-out;
    }
    /* .active */
</style>
<body>
    <div class = "hover">
        <button>Submit</button>
    </div>
    <div class = "active">
        <button>Save</button>
    </div>
</body>
</html>
