<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-+=1.0">
    <title>Document</title>
</head>
<body>
    <form action="table.html" method = "get">

        <label for="name">Name</label>
        <input type="text" placeholder="Enter name" id = "name"><br><br>
        <label for="age">Age</label>
        <input type="number" placeholder="Enter age" id = "age"><br><br>
        <label for="password">Password</label>
        <input type="password" placeholder="Enter password" id = "password"><br><br>
        <label for="phone">Phone Number</label>
        <input type="tel" placeholder="Enter PhoneNumber" id = "phone"><br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Username"><br><br>

        <label for="pwd">Password:</label>
        <input type="password" id="pwd" placeholder="Enter password"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter Email"><br><br>

        <input type="search" name="search-query"><br><br>

        <p>Choose your gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <p>Interests:</p>
    <input type="checkbox" id="coding" name="hobby" value="coding">
    <label for="coding">Coding</label><br><br>
    <input type="checkbox" id="music" name="hobby" value="music">
    <label for="music">Music</label><br><br>

    <label for="vol">Volume:</label>
    <input type="range" id="vol" name="volume" min="0" max="100"><br><br>

    <input type="file" name="resume"><br><br>

    <input type="color" name="favcolor"><br><br>

    <input type="hidden" name="user_id" value="12345"><br><br>

    <label for="cars">Choose a car:</label>
    <select id="cars" name="cars">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="fiat">Fiat</option>
    </select><br><br>

    <label for="bio">Biography:</label>
    <textarea id="bio" name="bio" rows="4" cols="50"></textarea><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset Form</button>
    <button type="button" onclick="alert('Hello!')">Click Me</button>
    </form>
    <img src="ahjm.jpg" alt="pic" sizes = 50px>
</body>
</html>
