<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login - Razor</title>
    <link rel="stylesheet" href="./practice1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body background="https://wallpaperaccess.com/full/20457680.gif">

    <header>
        <div class="logo">Razor</div>
        <div class="nav-right">
            <i class="fa-solid fa-earth-africa"></i>
            <a href="#" class="nav-link">Sign up</a>
            <button class="btn-demo">Request Demo</button>
        </div>
    </header>

    <div class="sales-email">
        Sales@Razor.uk &rarr;
    </div>

    <main>
        <!-- Main Auth Card -->
        <div class="login-card">
            <h1>Agent Login</h1>
            <p class="subtitle">Hey, Enter your details to get sign in<br>to your account</p>

            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Enter Email / Phone No">
                    <div class="field-action">
                        <i class="fa-regular fa-circle"></i>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Passcode">
                    <!-- <div class="field-action">Hide</div> -->
                    <label class="field-action" for="hidden">Hide</label>
                </div>

                <a href="#" class="trouble-link">Having trouble in sign in?</a>

                <button type="submit" class="btn-submit">Sign in</button>
            </form>

            <div class="divider">
                <span>Or Sign in with</span>
            </div>

            <div class="social-group">
                <button class="btn-social">
                    <i class="fa-brands fa-google"></i> Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-apple"></i> Apple ID
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                </button>
            </div>

            <p class="signup-text">
                Don't have an account? <a href="#">Request Now</a>
            </p>
        </div>
    </main>


</body>

</html>
