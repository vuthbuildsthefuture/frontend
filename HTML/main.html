<!DOCTYPE html>
<html lang="en">
<head>

  <title>Blue Screen Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {

  <h1>Welcome to My Blue Website</h1>

</html>
