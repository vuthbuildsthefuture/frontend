<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        td img {
            width: 80px;
            height: 50px;
            object-fit: contain;
        }

        td,
        th {
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-4">
        <table class="table table-bordered border-secondary text-center align-middle">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Brand</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody id="product"></tbody>
        </table>
    </div>

    <script>
        let products = [
            { image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/bHgGefxFVyfIiaDppe0bSVknc7wqWrIGuLDkfUEb.png", 
            code: 1629, 
            name: "Dell Alienware Aurora", 
            qty: 1, 
            price: 7150, 
            brand: "DELL", 
            category: "PC" },
            { image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/ijnSC8ntgREUk5TyjxIXpTVbUgIPjv57cMONqzCX.png", 
            code: 123, 
            name: "LED Monitor Dell 23.8''", 
            qty: 1, 
            price: 160, 
            brand: "DELL", 
            category: "Monitor" },
            { image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/hifLpkrdo37rGeJ8RkY03TimzAQats26p5Ig1fjo.png", 
            code: 1926, 
            name: "Printer Epson EcoTank L3210", 
            qty: 1, 
            price: 125, 
            brand: "Epson", 
            category: "Printer" },
            { image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/9DSm4DygGTSzCPUc0gsWS3VG8UUS6PUDWcFMt4xe.png", 
            code: 2619, 
            name: "ASUS ROG Strix G16", 
            qty: 1, 
            price: 1749, 
            brand: "Asus", 
            category: "Laptop" }
        ];

        let tbody = document.getElementById("product");

        products.forEach(p => {
            tbody.innerHTML += `
        <tr>
            <td><img src="${p.image}" alt="${p.name}"></td>
            <td>${p.code}</td>
            <td>${p.name}</td>
            <td>${p.qty}</td>
            <td>${p.price}$</td>
            <td>${p.brand}</td>
            <td>${p.category}</td>
        </tr>`;
        });
    </script>
</body>

</html>
