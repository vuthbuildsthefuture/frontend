<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            height: 160px;
            object-fit: contain;
            padding: 12px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="row g-4" id="product-list"></div>
    </div>

    <script>
        let products = [
            {
                image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/bHgGefxFVyfIiaDppe0bSVknc7wqWrIGuLDkfUEb.png",
                code: 1629,
                name: "Dell Alienware Aurora",
                qty: 1,
                price: 7150,
                brand: "DELL",
                category: "PC"
            },
            {
                image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/ijnSC8ntgREUk5TyjxIXpTVbUgIPjv57cMONqzCX.png",
                code: 123,
                name: "LED Monitor Dell 23.8''",
                qty: 1,
                price: 160,
                brand: "DELL",
                category: "Monitor"
            },
            {
                image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/hifLpkrdo37rGeJ8RkY03TimzAQats26p5Ig1fjo.png",
                code: 1926,
                name: "Printer Epson EcoTank L3210",
                qty: 1,
                price: 125,
                brand: "Epson",
                category: "Printer"
            },
            {
                image: "https://s3.ap-southeast-1.amazonaws.com/uploads-store/uploads/all/9DSm4DygGTSzCPUc0gsWS3VG8UUS6PUDWcFMt4xe.png",
                code: 2619,
                name: "ASUS ROG Strix G16",
                qty: 1,
                price: 1749,
                brand: "Asus",
                category: "Laptop"
            }
        ];

        let list = document.getElementById("product-list");

        products.forEach(p => {
            list.innerHTML += `
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="${p.image}" class="card-img-top" alt="${p.name}">
            <div class="card-body">
              <h5 class="card-title">${p.name}</h5>
              <p class="card-text text-muted mb-1">${p.brand} · ${p.category}</p>
              <p class="card-text mb-1">Code: ${p.code} | Qty: ${p.qty}</p>
              <p class="fs-5 fw-bold text-primary mb-0">${p.price}$</p>
            </div>
            <div class="card-footer bg-white border-0 pb-3">
              <button class="btn btn-primary w-100">Add to cart</button>
            </div>
          </div>
        </div>`;
        });
    </script>
</body>

</html>
