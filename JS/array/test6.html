<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form class="w-50 m-auto shadow rounded border-0 mt-3 p-3">
        <h1>Product Control</h1>
        <div class="row">
            <div class="col col-6">
                <label for="">Product Name</label>
                <input type="text" id="name" class="form-control">
            </div>
            <div class="col col-6">
                <label for="">Product Brand</label>
                <input type="text" id="brand" class="form-control">
            </div>
            <div class="col col-4">
                <label for="">Product Category</label>
                <input type="text" id="category" class="form-control">
            </div>
            <div class="col col-4">
                <label for="">Product Price</label>
                <input type="text" id="price" class="form-control">
            </div>
            <div class="col col-4">
                <label for="">Stock</label>
                <input type="text" id="stock" class="form-control">
            </div>
            <div class="col col-12">
                <label for="">Product Image</label>
                <input type="text" id="img" class="form-control">
            </div>
            <div class="col col-12">
                <label for="">Product Image</label>
                <textarea name="" id="description" class="form-control"></textarea>
            </div>
            <div class="mt-3">
                <button type="button" onclick="Create()" class="btn btn-success btn-outline-danger text-light border-0">Save</button>
            </div>
        </div>
    </form>
    <table class="w-75 m-auto mt-5 table table-bordered border-secondary text-center align-middle text-center">
        <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Price</th>
                <th>Description</th>
                <th>Stock</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="listProduct" class="text-center">
            
        </tbody>
    </table>

    <script>
        let Products = [];

        function Create() {

            let id;
            let name = document.getElementById("name").value;
            let brand = document.getElementById("brand").value;
            let category = document.getAnimations("category").value;
            let price = document.getElementById("price").value;
            let img = document.getElementById("img").value;
            let description = document.getElementById("description").value;
            let stock = document.getElementById("stock").value;

            let product = {
                id: Products.length,
                name: name,
                brand: brand,
                category: category,
                price: price,
                image: img,
                description: description,
            }
            Products.push(product);

            Display();

            document.getElementById("name").value = "";
            document.getElementById("brand").value = "";
            document.getElementById("category").value = "";
            document.getElementById("price").value = "";
            document.getElementById("img").value = "";
            document.getElementById("description").value = "";
            document.getElementById("stock").value = "";
        }
        function Display() {
            let listProduct = document.getElementById("listProduct");

            listProduct.innerHTML = "";
            Products.forEach((product, index)=>{
                listProduct.innerHTML += `
                <tr>
                <td>
                    <div style="width: 50px; height: 45px; overflow: hidden;">
                        <img src=${product.image} alt="" style="width: 100%; object-fit: cover;">
                    </div>
                </td>
                <td>${product.name}</td>
                <td>${product.brand}</td>
                <td>${product.category}</td>
                <td>$${product.price}</td>
                <td>${product.description}</td>
                <td>${product.stock}</td>
                <td>
                <div>
                    <button type="button" onclick="Edit(${index})" class="btn btn-primary">Edit</button>
                    <button type="button" onclick="Remove(${index})" class="btn btn-danger">Delete</button>
                </div>
            </td>
            </tr>
                `;
            })
        }
        function Remove(index) {
            Products.splice(index,1);
            Display();
        }
        function Edit(index){

            let product = Products[index];

            document.getElementById("img").value = product.image;
            document.getElementById("name").value = product.name;
            document.getElementById("brand").value = product.brand;
            document.getElementById("category").value = product.category;
            document.getElementById("price").value = product.price;
            document.getElementById("description").value = product.description;
            document.getElementById("stock").value = product.stock;

            Products.splice(index,1);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
