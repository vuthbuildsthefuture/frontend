<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>

    <script>

        let array = 
        [85, 75, 84, 95, 90, 75, 59, 85, 63, 57, 73, 84, 73];

        for(let i = 2; i <12; i+=3){
            document.write(array[i] + ",");
        }
        document.write("</br>");
        for(let i = 11; i >= 2; i-=3){
            document.write(array[i] + ",");
        }
        document.write("</br>");
        for(let i = 11; i >= 2; i-=2){
            document.write(array[i] + ",");
        }
        document.write("</br>");
        for(let i = 2; i <= 12; i+=9){
            document.write(array[i] + ",");
        }
        document.write("</br>");
        for(let i = 13; i > 2; i-=2){
            document.write(array[i] + ",");
        }
        document.write("</br>");

    </script>

</body>
</html>
