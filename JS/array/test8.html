<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let array = [
            [33, 55, 66, 77, 22, 90],
            [77, 66, 55, 23, 77, 22],
            [66, 76, 22, 56, 66, 77],
            [86, 75, 64, 86, 93, 85],
            [85, 75, 94, 63, 64, 90]
        ];

        for (let i = 0; i <= 4; i++) {
            let j = i + 1;
            document.write(array[i][j] + ", ");
        }

        document.write("</br>");

        for (let i = 0; i <= 5; i++) {
            document.write(array[0][i] + ", ");
        }
        document.write("</br>");

        for (let i = 4; i >= 0; i--) {
            let j = 5 - i;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        for (let i = 0; i <= 2; i++) {
            let j = i * 2;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        for (let i = 0; i <= 4; i += 2) {
            let j = i / 2;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        for (let i = 4; i >= 0; i -= 2) {
            let j = (i / 2) + 3;
            document.write(array[i][j] + ", ");
        }
        document.write("<br/>");

        for (let i = 1; i <= 3; i++) {
            let j = (i % 2 === 0) ? i : (i - 1);
            document.write(array[i][j] + ", ");
        }
        document.write("<br/>");

    </script>

</body>

</html>
