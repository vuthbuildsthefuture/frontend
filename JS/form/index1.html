<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    
    <div>
        <!-- Create form -->
        <form class="w-50 p-5 rounded-3 m-auto border">
            <h1 class="text-center">Student Information</h1>

            <div class="row">
                <div class="col col-6">
                    <label class="fw-bold">ID Student</label><br>
                    <input type="text" id="id" class="w-100">

                </div>
                <div class="col col-6">
                    <label class="fw-bold">Name</label><br>
                    <input type="text" id="name" class="w-100">
                </div>
                <div class="col col-6">
                    <label class="fw-bold">Gender</label><br>
                    <input type="text" id="gender" class="w-100">
                </div>
                <div class="col col-6">
                    <label class="fw-bold">Age</label><br>
                    <input type="text" id="age" class="w-100">
                </div>
                <div class="col col-4">
                    <label class="fw-bold">HTML Score</label><br>
                    <input type="text" id="s1" class="w-100">
                </div>
                <div class="col col-4">
                    <label class="fw-bold">JS Score</label><br>
                    <input type="text" id="s2" class="w-100">
                </div>
                <div class="col col-4">
                    <label class="fw-bold">CSS Score</label><br>
                    <input type="text" id="s3" class="w-100">
                </div>
            </div>
            <button onclick="Student()" type="button" class="mt-3 bg-success text-white btn">Submit</button>
        </form>
    </div>
    <div>
        <h1 class="mt-4 container m-auto">List of Students :</h1>
    </div>
    <table class="table text-center container m-auto mt-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Age</th>
                <th>Total Score</th>
                <th>Average</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody id="result">
        </tbody>
    </table>
    <script>

        function Student(){
    
            let id = document.getElementById("id").value;
            let name = document.getElementById("name").value;
            let gender = document.getElementById("gender").value;
            let age = document.getElementById("age").value;
    
            let s1 = Number(document.getElementById("s1").value);
            let s2 = Number(document.getElementById("s2").value);
            let s3 = Number(document.getElementById("s3").value);
    
            let total_score = s1 + s2 + s3;
            let evg = total_score / 3;
            let grade;
    
            if(evg >= 90){
                grade = "A";
            }else if(evg >= 80){
                grade = "B";
            }else if(evg >= 70 ){
                grade = "C";
            }else if (evg >= 60){
                grade = "D";
            }else if(evg >= 50){
                grade = "E";
            }else{
                grade = "F";
            }
    
            document.getElementById("result").innerHTML += 
            `<tr>
                <td>${id}</td>
                <td>${name}</td>
                <td>${gender}</td>
                <td>${age}</td>
                <td>${total_score.toFixed(2)}</td>
                <td>${evg.toFixed(2)}</td>
                <td>${grade}</td>
            </tr>`;
    
            // Reset form
            document.getElementById("id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("gender").value = "";
            document.getElementById("age").value = "";
            document.getElementById("s1").value = "";
            document.getElementById("s2").value = "";
            document.getElementById("s3").value = "";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
