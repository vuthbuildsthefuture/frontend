<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form class="w-50 m-auto mt-4 p-4 shadow bg-dark bg-opacity-10 rounded-3">
        <h1>Shopping</h1>
        <label class="text-danger fw-bold fs-3">Select Product</label><br>
        <select id="price" class="form-control">
            <option value="1">coca cola $ 1</option>
            <option value="0.25">ice $ 0.25</option>
            <option value="0.75">water $ 0.75</option>
        </select>
        <label class="text-danger fw-bold fs-3 mt-2">Quantity</label><br>
        <input type="number" id="qty" class="form-control" value="1" min="1">
        
        <!-- Added type="button" to prevent form refresh -->
        <button type="button" onclick="Product()" class="btn btn-danger btn-outline-primary text-light mt-3">Buy Now</button>
    </form>

    <div id="result" class="w-25 mt-4 m-auto shadow rounded-3 p-3"></div>

    <script>
        function Product() {
            let price = Number(document.getElementById("price").value);
            let qty = Number(document.getElementById("qty").value);

            let total = qty * price;
            let dis = 0;

            // Correct order: check higher quantity thresholds first
            if (qty >= 30) {
                dis = 25;
            } else if (qty >= 10) {
                dis = 10;
            } else {
                dis = 0;
            }

            // Correct percentage formula
            let payment = total - (total * dis) / 100;

            // Use '=' instead of '+=' to clear old receipts on new clicks
            document.getElementById("result").innerHTML += `
                <h4><i><u class="text-success">Receipt</u></i></h4>
                <p>Price: $${price.toFixed(2)}</p>
                <p>Quantity: ${qty}</p>
                <p>Total Price: $${total.toFixed(2)}</p>
                <p>Discount: ${dis}%</p>
                <p>Payment: $${payment.toFixed(2)}</p>
            `;
        }
    </script>
</body>
</html>
