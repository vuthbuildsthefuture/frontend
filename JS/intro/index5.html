<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="loop"></div>

    <script>
        let n = 20;
        let out;

        out = document.getElementById("loop");

        for (let i = 0; i <= n; i++) {
            out.innerHTML += `<p>This is number : ${i}</p>`;
        }
    </script>

</body>

</html>
