<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form class="w-50 m-auto mt-5 form-control shadow" id="productForm">
        <h1>Product</h1>
        <div class="row">
            <div class="col-12">
                <label class="fs-4 fw-bold">Code of Product</label><br>
                <input type="text" id="code" class="w-100 form-control">
            </div>
            <div class="col-4">
                <label class="fs-4 fw-bold">Product Name</label><br>
                <input type="text" id="name" class="w-100 form-control">
            </div>
            <div class="col-4">
                <label class="fs-4 fw-bold">Product Qty</label><br>
                <input type="text" id="qty" class="w-100 form-control">
            </div>
            <div class="col-4">
                <label class="fs-4 fw-bold">Product Price</label><br>
                <input type="text" id="price" class="w-100 form-control">
            </div>
            <div class="col-6">
                <label class="fs-4 fw-bold">Product Category</label><br>
                <input type="text" id="category" class="w-100 form-control">
            </div>
            <div class="col-6">
                <label class="fs-4 fw-bold">Product Brand</label><br>
                <input type="text" id="brand" class="w-100 form-control">
            </div>
            <div class="col-12">
                <label class="fs-4 fw-bold">Image</label><br>
                <input type="text" id="img" class="w-100 form-control">
            </div>
        </div>
        <button type="button" class="btn btn-success btn-outline-info text-black mt-4"
            onclick="Product()">Submit</button>
    </form>

    <table class="table text-center container m-auto">
        <thead>
            <tr>
                <th>Image</th>
                <th>Code</th>
                <th>Name</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Discount</th>
                <th>Total Price</th>
                <th>Payment</th>
            </tr>
        </thead>
        <tbody id="list">

        </tbody>
    </table>

    <script>
        function Product() {
            let code = document.getElementById("code").value;
            let name = document.getElementById("name").value;
            let qty = Number(document.getElementById("qty").value);
            let price = Number(document.getElementById("price").value);
            let category = document.getElementById("category").value;
            let brand = document.getElementById("brand").value;
            let img = document.getElementById("img").value;

            let total = qty * price;

            let dis = 0;
            if (total >= 100) {
                dis = 20;
            } else if (total >= 50) {
                dis = 10;
            } else {
                dis = 0;
            }

            let payment = total - (total * dis) / 100;

            document.getElementById("list").innerHTML +=
                `<tr>
        <td class="img-cell"><img src="${img}" alt="${name}"></td>
        <td>${code}</td>
        <td>${name}</td>
        <td>${qty}</td>
        <td>${price}</td>
        <td>${category}</td>
        <td>${brand}</td>
        <td>${dis}%</td>
        <td>${total.toFixed(2)}</td>
        <td>${payment.toFixed(2)}</td>
    </tr>`;
            document.getElementById("code").value = "";
            document.getElementById("name").value = "";
            document.getElementById("qty").value = "";
            document.getElementById("price").value = "";
            document.getElementById("img").value = "";
            document.getElementById("brand").value = "";
            document.getElementById("category").value = "";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
